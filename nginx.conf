# Configuración Nginx para filemanager.testing.vulpik.com
# Colocar en /etc/nginx/sites-available/ y crear enlace simbólico en sites-enabled

server {
    listen 80;
    server_name filemanager.testing.vulpik.com;

    root /var/www/testing/filemanager/frontend/build;
    index index.html;

    # Autenticación básica para todo el sitio
    auth_basic "FileManager - Acceso restringido";
    auth_basic_user_file /var/www/testing/filemanager/.htpasswd;

    # Proxy para API
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend SPA (React)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Logs
    access_log /var/log/nginx/filemanager.access.log;
    error_log /var/log/nginx/filemanager.error.log;
}
